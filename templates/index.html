<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Recommender System</title>
    <style>
        /* Black background for the body */
        body {
            font-family: Arial, sans-serif;
            background-color: #000000; /* Black background */
            color: #fff; /* White text for contrast */
            text-align: center;
            margin: 0;
            padding: 0;
            height: 100vh;
        }

        h1 {
            margin-top: 80px;
            font-size: 36px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7); /* Text shadow for readability */
        }

        /* Centering the form with a darker background and white text */
        form {
            background-color: rgba(255, 255, 255, 0.2); /* Semi-transparent white */
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6); /* Soft shadow for depth */
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        /* Form elements styling */
        label {
            font-size: 18px;
            font-weight: bold;
            color: #fff; /* White text for the label */
            margin-bottom: 10px;
            display: block;
        }

        select, button {
            padding: 12px;
            margin: 15px 0;
            font-size: 16px;
            width: 100%;
            border-radius: 5px;
            border: 1px solid #ddd;
        }

        select {
            background-color: #333; /* Dark background for select */
            color: #fff; /* White text in select box */
        }

        button {
            background-color: #00c6ff; /* Light blue button */
            color: white;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #0072ff; /* Darker blue on hover */
        }

        /* Responsive design for mobile screens */
        @media (max-width: 600px) {
            h1 {
                font-size: 28px;
            }

            form {
                width: 90%;
                padding: 20px;
            }

            button {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <h1>Movie Recommender System</h1>
    <form action="/recommend" method="post">
        <label for="movie">Select a Movie:</label>
        <select name="movie" id="movie">
            {% for movie in movie_list %}
                <option value="{{ movie }}">{{ movie }}</option>
            {% endfor %}
        </select>
        <br>
        <button type="submit">Show Recommendations</button>
    </form>
</body>
</html>
